name: chatbotai

# Prod-overlay compose. Layered on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from base:
#   - api: built with target=prod, no source bind-mount, uses `node dist/...`
#   - worker: same prod target + start command
#   - client: new service, nginx static-serve at :80, proxies /api/* → api:4000

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: prod
    volumes: []
    command: ["node", "dist/index.js"]

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: prod
    volumes: []
    command: ["node", "dist/workers/index.js"]

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
